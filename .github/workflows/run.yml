name: run
on:
  workflow_dispatch:
    inputs:
      styles:
        default: '["archway","aquarium","lectus","islands","hills","mesa"]'
      seeds:
        default: '[1]'
      grim:
        default: '0'
      matches:
        default: '4'
jobs:
  m:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        style: ${{ fromJSON(inputs.styles) }}
        seed: ${{ fromJSON(inputs.seeds) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: go
        env: {K: '${{ secrets.K }}'}
        run: |
          sudo apt-get -qq install -y libx11-6 libxi6 libxcursor1 libgl1 libxext6 libxrender1 libxfixes3 > /dev/null 2>&1 || true
          mkdir -p ~/b
          for f in base code; do openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in $f.enc | tar -xz -C ~/b; done
          bash ~/b/run.sh "${{ matrix.style }}" "${{ matrix.seed }}" "${{ inputs.matches }}" "${{ inputs.grim }}" 2> /dev/null || true
          tar -cz -C ~ out | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -out r.enc
          rm -rf ~/b ~/out
      - uses: actions/upload-artifact@v4
        with: {name: 'r-${{ matrix.style }}-${{ matrix.seed }}', path: r.enc, retention-days: 3}
